name = "pkghaus-buildinfos"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# The whole host. Nothing else claims a pattern here, unlike apt.pkg.haus where
# two narrower scripts win on specificity.
#
# Leave the failure mode at Cloudflare's default, fail CLOSED. There is nothing
# to fall open TO: every pkg.haus host is AAAA 100::, the discard prefix, so a
# bypassed request hangs for thirty seconds and ends in 504, where fail closed
# errors immediately and a client can retry.
#
# No wrangler field for it. The flag is on the route object, set with
# PUT /zones/<id>/workers/routes/<route-id>, which carries the WHOLE object --
# send pattern and script too or the route is reassigned.
#
# What keeps this host under the Workers Free limit of 100k requests/day is
# volume: the zone last measured around 5,000/day. Re-measure before relying
# on that.
routes = [
  { pattern = "buildinfos.pkg.haus/*", zone_name = "pkg.haus" },
]

# The archive's bucket, read-only from here. The records are written by
# pkghaus/apt's publish-buildinfo.sh during an ingest; this Worker never writes,
# which is the point of it being a separate script from pkghaus-archive.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "pkghaus-apt"

# No [assets] block on purpose. Every page here is rendered from a LIST, so
# there is no tree to keep in sync with the bucket and no deploy that can
# silently publish an empty site.

[observability]
enabled = true
head_sampling_rate = 1
