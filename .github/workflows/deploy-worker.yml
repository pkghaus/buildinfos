name: Deploy the buildinfos worker

# pkghaus-buildinfos puts the build records and their source packages on the
# network out of the archive's R2 bucket. Gated behind CI as a reusable
# workflow rather than duplicating the jobs, so a deploy cannot outrun a
# failing test.

on:
  push:
    branches: [master]
    paths:
      - worker/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-buildinfos-worker
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      # The token needs account Workers Scripts: Edit, account Workers R2
      # Storage Read (wrangler validates the r2_bucket binding by calling the
      # account-level buckets API, which the bucket-scoped "Bucket Item"
      # permissions do not satisfy), and zone Workers Routes: Edit on pkg.haus.
      # Missing only the routes permission uploads the script and then fails
      # the routes call with "Authentication error [code: 10000]", which reads
      # like a broken token rather than a missing scope.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_BUILDINFOS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
