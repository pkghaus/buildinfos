version: 2

updates:
  # First-party actions stay on major tags and actionlint is pinned by image
  # digest. The digest is what stops a moved image changing what lints this
  # worker, and it stops that image updating on its own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # wrangler is pinned exactly and runs with a token that can deploy a worker
  # on the archive's host. Pinning stops it changing on its own; this stops it
  # going stale. The directory is /worker, not /: package.json lives beside the
  # worker, and a config pointing at the root finds nothing and reports
  # nothing, so the gap reads exactly like coverage.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
